<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
html,body{height:100%}
body{
height:100vh;
height:100dvh;
background:#000 url('1.jpg');
background-size:cover;background-position:center;
display:flex;justify-content:center;align-items:center;
padding:0;
color:#fff;
overscroll-behavior-y:auto;
touch-action:pan-y;
}
/* اول ما يبدأ الشفط، الخلفية تبقى سودا على طول، عشان متظهرش لوحدها */
body.sucking{background:#000 !important}
.card{
width:80%;
max-width:80%;
height:auto;
max-height:86vh;
max-height:86dvh;
background:rgba(20,12,4,0.45);
backdrop-filter:blur(6px);
-webkit-backdrop-filter:blur(6px);
border:1px solid rgba(245,197,24,0.45);
border-radius:28px;
padding:22px 20px 18px;
text-align:center;
display:flex;
flex-direction:column;
justify-content:center;
gap:6px;
margin:auto;
overflow:hidden;
box-shadow:0 10px 40px rgba(0,0,0,0.35);
}
.avatar{width:125px;height:125px;border-radius:50%;object-fit:cover;border:4px solid #e8d48a;margin:0 auto;flex-shrink:0;cursor:pointer}
h1{font-size:32px;color:#f5e6a8;line-height:1.1;margin-bottom:12px;margin-top:10px;flex-shrink:0;text-shadow:0 2px 10px rgba(0,0,0,0.6)}
a{
display:flex;align-items:center;gap:14px;text-decoration:none;
background:rgba(255,255,255,0.12);
backdrop-filter:blur(3px);
-webkit-backdrop-filter:blur(3px);
border:1px solid rgba(201,162,39,0.7);
padding:13px 14px;border-radius:20px;margin-bottom:0;
color:#fff;text-align:left;position:relative;z-index:2;
will-change:transform,opacity;
flex-shrink:0;
}
a b{font-size:19px;display:block;text-shadow:0 1px 6px rgba(0,0,0,0.6)}
.icon{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:23px;flex-shrink:0;color:#fff}
.wa .icon{background:#25D366}
.fb .icon{background:#1877F2}
.ig .icon{background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)}
.tk .icon{background:#000;border:1px solid #444}
.ph .icon{background:#25D366}
a.sucked{animation:suckAway 0.18s ease-out forwards !important}
@keyframes suckAway{
  0%{transform:scale(1);opacity:1}
  100%{transform:scale(0);opacity:0}
}
/* شفط اقوى واسرع: 0.45 ثانية بس */
a.chosen{
animation:chosenSuck 0.45s cubic-bezier(0.5,0,0.9,0.4) forwards !important;
z-index:50;
border-color:#f5c518;
background:#000;
will-change:transform;
}
@keyframes chosenSuck{
  0%{transform:scale(1)}
  15%{transform:scale(1.25)}
  100%{transform:scale(45);opacity:1;border-radius:50%}
}
body.sucking .card{animation:cardIn 0.45s ease-in forwards !important}
@keyframes cardIn{
  0%{transform:scale(1);opacity:1}
  100%{transform:scale(0.05);opacity:0}
}
body.sucking h1, body.sucking .avatar{opacity:0}
.lightbox{
position:fixed;inset:0;background:rgba(0,0,0,0.92);
display:none;align-items:center;justify-content:center;
z-index:999;flex-direction:column;gap:16px;
}
.lightbox.open{display:flex}
.lightbox img{
max-width:92vw;max-height:82vh;object-fit:contain;
border-radius:16px;border:2px solid #f5c518;
}
.lightbox .close{
position:absolute;top:18px;right:22px;font-size:38px;
color:#fff;cursor:pointer;line-height:1;
}
.lightbox span{color:#f5e6a8;font-size:18px}
@media (min-width:768px){
.card{max-width:80%;padding:32px 38px 28px;border-radius:34px}
.avatar{width:180px;height:180px;border-width:5px}
h1{font-size:52px;margin-bottom:20px;margin-top:14px}
a{padding:18px 24px;border-radius:26px;gap:20px}
a b{font-size:26px}
.icon{width:64px;height:64px;font-size:32px}
}
</style>
</head>
<body>

<div class="card" id="mainCard">
<img id="profilePic" class="avatar" src="IMG-20261126-WA0200.jpg" alt="Mr Ziko">
<h1>Mr. Ziko Gamal</h1>

<a class="wa link-btn" href="https://wa.me/201028338635"><div class="icon"><i class="fa-brands fa-whatsapp"></i></div><div><b>WhatsApp 1</b></div></a>
<a class="wa link-btn" href="https://wa.me/201284243774"><div class="icon"><i class="fa-brands fa-whatsapp"></i></div><div><b>WhatsApp 2</b></div></a>
<a class="fb link-btn" href="https://www.facebook.com/ziko.gamal.315"><div class="icon"><i class="fa-brands fa-facebook-f"></i></div><div><b>Facebook</b></div></a>
<a class="ig link-btn" href="https://www.instagram.com/ziko_gamal_10"><div class="icon"><i class="fa-brands fa-instagram"></i></div><div><b>Instagram</b></div></a>
<a class="tk link-btn" href="https://www.tiktok.com/@ziko_gamal_10"><div class="icon"><i class="fa-brands fa-tiktok"></i></div><div><b>TikTok</b></div></a>
<a class="ph link-btn" href="tel:+201028338635"><div class="icon"><i class="fa-solid fa-phone"></i></div><div><b>Call</b></div></a>
</div>

<div class="lightbox" id="lightbox">
<div class="close" id="closeBtn">&times;</div>
<img id="bigPic" src="" alt="Mr Ziko">
<span>دوس في اي حتة عشان تقفل</span>
</div>

<script>
const backgrounds = [
  '1.jpg',
  '2.jpg',
  '3.jpg',
  '4.jpg',
  '5.jpg',
  '6.jpg',
  '7.jpg',
  '8.jpg',
  '9.jpg',
  '10.jpg'
];
const pics = [
"FB_IMG_1795706237442.jpg",
"IMG-20261126-WA0200.jpg",
"IMG-20261126-WA0201.jpg",
"IMG-20261126-WA0203.jpg",
"IMG-20261126-WA0205.jpg",
"IMG-20261126-WA0206.jpg",
"IMG-20261126-WA0208.jpg",
"img_1_1795706101740.jpg",
"img_3_1795706121841.jpg"
];

// صورة شخصية: نحمل واحدة بس في الاول
let picIndex = Math.floor(Math.random() * pics.length);
let currentPic = pics[picIndex];
const profilePicEl = document.getElementById("profilePic");
profilePicEl.src = currentPic;

// بعد ما الصورة الاولى تفتح، نحمل الباقي واحدة ورا واحدة
let picPreloadStarted = false;
function preloadRestPics(){
  if(picPreloadStarted) return;
  picPreloadStarted = true;
  const restPics = pics.filter(p => p !== currentPic);
  let j = 0;
  function loadNextPic(){
    if(j >= restPics.length) return;
    const img = new Image();
    img.onload = () => { j++; setTimeout(loadNextPic, 900); };
    img.onerror = () => { j++; setTimeout(loadNextPic, 900); };
    img.src = restPics[j];
  }
  setTimeout(loadNextPic, 2500);
}
profilePicEl.onload = preloadRestPics;
profilePicEl.onerror = () => {
  picIndex = (picIndex + 1) % pics.length;
  currentPic = pics[picIndex];
  profilePicEl.src = currentPic;
};
if(profilePicEl.complete) preloadRestPics();

// خلفية: نحمل واحدة بس في الاول
let bgIndex = Math.floor(Math.random() * backgrounds.length);
let currentBg = backgrounds[bgIndex];
let tried = 0;
function loadFirstBg(){
  if(tried >= backgrounds.length) return;
  const bg = backgrounds[bgIndex];
  const test = new Image();
  test.onload = () => {
    document.body.style.backgroundImage = `url('${bg}')`;
    currentBg = bg;
    startPreloadRestBg();
  };
  test.onerror = () => {
    bgIndex = (bgIndex + 1) % backgrounds.length;
    tried++;
    loadFirstBg();
  };
  test.src = bg;
  document.body.style.backgroundImage = `url('${bg}')`;
}
loadFirstBg();

// خلفيات الباقي: واحدة ورا واحدة
let bgPreloadStarted = false;
function startPreloadRestBg(){
  if(bgPreloadStarted) return;
  bgPreloadStarted = true;
  const rest = backgrounds.filter(b => b !== currentBg);
  let i = 0;
  function loadNext(){
    if(i >= rest.length) return;
    const img = new Image();
    img.onload = () => { i++; setTimeout(loadNext, 800); };
    img.onerror = () => { i++; setTimeout(loadNext, 800); };
    img.src = rest[i];
  }
  setTimeout(loadNext, 2000);
}

const profilePic = document.getElementById("profilePic");
const lightbox = document.getElementById("lightbox");
const bigPic = document.getElementById("bigPic");
const closeBtn = document.getElementById("closeBtn");
profilePic.addEventListener("click", function(){
  bigPic.src = this.src;
  lightbox.classList.add("open");
});
closeBtn.addEventListener("click", function(){
  lightbox.classList.remove("open");
});
lightbox.addEventListener("click", function(e){
  if(e.target !== bigPic){
    lightbox.classList.remove("open");
  }
});
function resetAll(){
  document.querySelectorAll('.link-btn').forEach(b=>{
    b.classList.remove('sucked','chosen');
    b.style.animationDelay = '';
    b.style.transform = '';
    b.style.opacity = '';
  });
  document.body.classList.remove('sucking');
}
resetAll();
window.addEventListener('pageshow', resetAll);
window.addEventListener('focus', resetAll);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) resetAll(); });
document.querySelectorAll('.link-btn').forEach(btn => {
  btn.addEventListener('click', function(e){
    e.preventDefault();
    const targetUrl = this.href;
    if(this.classList.contains('chosen')) return;
    document.querySelectorAll('.link-btn').forEach((other, index) => {
      if(other !== btn){
        other.style.animationDelay = (index * 0.02) + 's';
        other.classList.add('sucked');
      }
    });
    btn.classList.add('chosen');
    document.body.classList.add('sucking');
    setTimeout(resetAll, 2000);
    // اسرع: يدخلك بعد 480 مللي ثانية بس، قبل ما الخلفية تظهر لوحدها
    setTimeout(()=>{ window.location.href = targetUrl; }, 480);
  });
});
</script>

</body>
</html>
