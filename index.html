<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mr. Ziko Gamal</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
html,body{height:100%}
body{
height:100vh;
height:100dvh;
background:#000;
background-size:cover;background-position:center;
display:flex;justify-content:center;align-items:center;
padding:0;
color:#fff;
overscroll-behavior-y:auto;
touch-action:pan-y;
}
.card{
width:80%;
height:80vh;
height:80dvh;
max-width:80%;
background:rgba(20,12,4,0.85);
border:1px solid rgba(245,197,24,0.35);
border-radius:28px;
padding:32px 22px 26px;
text-align:center;
display:flex;
flex-direction:column;
justify-content:center;
gap:8px;
margin:auto;
}
.avatar{width:165px;height:165px;border-radius:50%;object-fit:cover;border:4px solid #e8d48a;margin:0 auto}
h1{font-size:36px;color:#f5e6a8;line-height:1.1;margin-bottom:22px;margin-top:14px}
a{
display:flex;align-items:center;gap:16px;text-decoration:none;
background:rgba(255,255,255,0.08);
border:1px solid #c9a227;
padding:16px 16px;border-radius:22px;margin-bottom:10px;
color:#fff;text-align:left;position:relative;z-index:2;
will-change:transform,opacity;
}
a b{font-size:20px;display:block}
.icon{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;color:#fff}
.wa .icon{background:#25D366}
.fb .icon{background:#1877F2}
.ig .icon{background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)}
.tk .icon{background:#000;border:1px solid #444}
.ph .icon{background:#25D366}
a.sucked{animation:suckAway 0.28s ease-out forwards}
@keyframes suckAway{
  0%{transform:scale(1);opacity:1}
  100%{transform:scale(0);opacity:0}
}
a.chosen{
animation:chosenSuck 0.55s ease-in forwards;
z-index:50;
border-color:#f5c518;
background:#000;
}
@keyframes chosenSuck{
  0%{transform:scale(1)}
  25%{transform:scale(1.3)}
  100%{transform:scale(30);opacity:1;border-radius:50%}
}
body.sucking .card{animation:cardIn 0.55s ease-in forwards}
@keyframes cardIn{
  0%{transform:scale(1);opacity:1}
  100%{transform:scale(0.1);opacity:0}
}
body.sucking h1, body.sucking .avatar{opacity:0}
@media (min-width:768px){
.card{max-width:80%;padding:48px 42px 36px;border-radius:34px}
.avatar{width:225px;height:225px;border-width:5px}
h1{font-size:58px;margin-bottom:34px;margin-top:18px}
a{padding:24px 28px;border-radius:28px;margin-bottom:18px;gap:22px}
a b{font-size:28px}
.icon{width:74px;height:74px;font-size:36px}
}
</style>
</head>
<body>

<div class="card" id="mainCard">
<img id="profilePic" class="avatar" src="IMG-20261126-WA0200.jpg" alt="Mr Ziko">
<h1>Mr. Ziko Gamal</h1>

<a class="wa link-btn" href="https://wa.me/201028338635"><div class="icon"><i class="fa-brands fa-whatsapp"></i></div><div><b>WhatsApp 1</b></div></a>
<a class="wa link-btn" href="https://wa.me/201284243774"><div class="icon"><i class="fa-brands fa-whatsapp"></i></div><div><b>WhatsApp 2</b></div></a>
<a class="fb link-btn" href="https://www.facebook.com/ziko.gamal.315"><div class="icon"><i class="fa-brands fa-facebook-f"></i></div><div><b>Facebook</b></div></a>
<a class="ig link-btn" href="https://www.instagram.com/ziko_gamal_10"><div class="icon"><i class="fa-brands fa-instagram"></i></div><div><b>Instagram</b></div></a>
<a class="tk link-btn" href="https://www.tiktok.com/@ziko_gamal_10"><div class="icon"><i class="fa-brands fa-tiktok"></i></div><div><b>TikTok</b></div></a>
<a class="ph link-btn" href="tel:+201028338635"><div class="icon"><i class="fa-solid fa-phone"></i></div><div><b>Call</b></div></a>
</div>

<script>
const backgrounds = [
  'IMG-20261126-WA0189.jpg',
  'IMG-20261126-WA0190.jpg',
  'IMG-20261126-WA0191.jpg',
  'IMG-20261126-WA0192.jpg',
  'IMG-20261126-WA0193.jpg',
  'IMG-20261126-WA0194.jpg',
  'IMG-20261126-WA0195.jpg',
  'IMG-20261126-WA0196.jpg',
  'IMG-20261126-WA0197.jpg',
  'IMG-20261126-WA0198.jpg',
  'IMG-20261126-WA0207.jpg'
];
const randomBg = backgrounds[Math.floor(Math.random() * backgrounds.length)];
const firstImg = new Image();
firstImg.src = randomBg;
firstImg.onload = () => {
  document.body.style.backgroundImage = `url('${randomBg}')`;
};
backgrounds.forEach(src => {
  if (src !== randomBg) {
    const img = new Image();
    img.src = src;
  }
});
const pics = [
"IMG-20261126-WA0200.jpg",
"IMG-20261126-WA0201.jpg",
"IMG-20261126-WA0203.jpg",
"IMG-20261126-WA0205.jpg",
"IMG-20261126-WA0206.jpg",
"IMG-20261126-WA0208.jpg"
];
document.getElementById("profilePic").src = pics[Math.floor(Math.random() * pics.length)];
function resetAll(){
  document.querySelectorAll('.link-btn').forEach(b=>{
    b.classList.remove('sucked','chosen');
    b.style.animationDelay = '';
    b.style.transform = '';
    b.style.opacity = '';
  });
  document.body.classList.remove('sucking');
}
resetAll();
window.addEventListener('pageshow', resetAll);
window.addEventListener('focus', resetAll);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) resetAll(); });
document.querySelectorAll('.link-btn').forEach(btn => {
  btn.addEventListener('click', function(e){
    e.preventDefault();
    const targetUrl = this.href;
    if(this.classList.contains('chosen')) return;
    document.querySelectorAll('.link-btn').forEach((other, index) => {
      if(other !== btn){
        other.style.animationDelay = (index * 0.02) + 's';
        other.classList.add('sucked');
      }
    });
    btn.classList.add('chosen');
    document.body.classList.add('sucking');
    setTimeout(resetAll, 2000);
    setTimeout(()=>{ window.location.href = targetUrl; }, 650);
  });
});
</script>

</body>
</html>
