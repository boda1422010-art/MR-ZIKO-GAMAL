    align-items: center;

    font-weight: bold;
    color: white;
    margin-bottom: 15px;
  }
  h1 { font-size: 28px; margin-bottom: 5px; }
  p { color: #666; margin-bottom: 25px; }
  .btn {
    width: 100%;
    display: block;
    padding: 16px;
    margin-bottom: 12px;
    border-radius: 15px;
    text-decoration: none;
    color: white;
    font-weight: bold;
    font-size: 17px;
    text-align: center;

  .tiktok { background: #000; }
  .insta { background: linear-gradient(45deg, #f09433, #dc2743, #bc1888); }
  .whats { background: #25D366; }
  .face { background: #1877F2; }
